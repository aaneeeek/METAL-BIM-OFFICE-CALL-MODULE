services:
  bim_media_soup:
    build: .
    container_name: bim_media_soup
    restart: "unless-stopped"
    ports:
      - "443:443/tcp"
      - "20000:20000/udp"
      - "40000-40100:40000-40100/udp"
    volumes:
      - .:/app
      - /app/node_modules
      - ./certs:/app/certs:ro
    env_file:
      - .env
